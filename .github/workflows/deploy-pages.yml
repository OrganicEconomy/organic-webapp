name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress run finish rather than
# cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production
      - name: SPA fallback for client-side routing
        run: cp dist/organic-webapp/browser/index.html dist/organic-webapp/browser/404.html
      - name: Set the custom domain
        run: echo "economie-organique.fr" > dist/organic-webapp/browser/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/organic-webapp/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
