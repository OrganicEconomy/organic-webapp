<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Connexion</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-list>
      @for (user of users; track user.name) {
        <mat-list-item>
          <button mat-stroked-button (click)="selectUser($index)">
            {{ user.name }}
          </button>
        </mat-list-item>
      } @empty {
        <mat-list-item>
          Il n'y a personne ici ! Il faut se connecter ou créer un compte, mon chou.
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>

  <mat-card-actions>
    <a mat-button routerLink="/server-selection">Ajouter un compte</a>
    <a mat-button routerLink="/restore-account">Restaurer un compte</a>
  </mat-card-actions>
</mat-card>
