<h2 mat-dialog-title>Session verrouillée</h2>
<mat-dialog-content>
  <p>Après 15 minutes sans activité, votre mot de passe est demandé à nouveau.</p>
  <mat-form-field class="full-width">
    <mat-label>Mot de passe</mat-label>
    <input matInput type="password" [(ngModel)]="password" (keyup.enter)="unlock()">
  </mat-form-field>
  @if (error) {
    <p class="unlock-error">{{ error }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button type="button" (click)="changeAccount()">Changer de compte</button>
  <button mat-flat-button type="button" (click)="unlock()">Déverrouiller</button>
</mat-dialog-actions>
