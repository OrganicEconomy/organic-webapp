<div class="login-wrapper">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Adresse mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="turlututu@chapeau.tu">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Afficher le mot de passe'" [attr.aria-pressed]="!hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-checkbox formControlName="stayConnected" class="stay-connected">
          Rester connecté
        </mat-checkbox>

        <button mat-flat-button color="primary" type="submit" class="full-width submit-btn">
          Se connecter
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions>
      <span class="mat-body-2">Pas encore de compte ?</span>
      <a mat-button color="primary" routerLink="/signup">Créer un compte</a>
    </mat-card-actions>
  </mat-card>
</div>
