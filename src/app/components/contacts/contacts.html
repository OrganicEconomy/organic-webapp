<mat-card appearance="outlined">
    <mat-card-content>
        <h1>Contacts</h1>

        <mat-form-field class="search-field" subscriptSizing="dynamic">
            <mat-label>Rechercher</mat-label>
            <input matInput type="search" [value]="search()" (input)="search.set($any($event.target).value)">
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="table-scroll">
            <table mat-table [dataSource]="visibleContacts()">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Nom</th>
                    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                </ng-container>

                <ng-container matColumnDef="pk">
                    <th mat-header-cell *matHeaderCellDef>Clé publique</th>
                    <td mat-cell *matCellDef="let element" class="pk-cell">{{ truncate(element.pk) }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>

        @if (search() && visibleContacts().length === 0) {
            <p class="no-match">Aucun contact ne correspond à « {{ search() }} ».</p>
        }

        <div class="actions">
            <a mat-stroked-button routerLink="/addcontact">
                <i class="bi bi-person-plus"></i> Nouveau contact
            </a>
            <button mat-stroked-button type="button" class="export-contacts" (click)="exportContacts()" [disabled]="hasNoContacts()">
                <i class="bi bi-download"></i> Exporter mes contacts
            </button>
        </div>
    </mat-card-content>
</mat-card>
