<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>{{ data.message }}</div>

<div mat-dialog-actions class="actions">
  <button mat-stroked-button class="cancel-button" [mat-dialog-close]="false">{{ data.cancelLabel ?? 'Annuler' }}</button>
  <button mat-flat-button class="confirm-button" [mat-dialog-close]="true">{{ data.confirmLabel ?? 'Confirmer' }}</button>
</div>
