@if (user) {
<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Engager mes invests</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-radio-group [(ngModel)]="pocket">
      <mat-radio-button value="invests">Invests</mat-radio-button>
      <mat-radio-button value="money">Monnaie</mat-radio-button>
    </mat-radio-group>

    <mat-form-field>
      <mat-label>Montant par jour</mat-label>
      <input matInput type="number" [(ngModel)]="dailyAmount" [max]="max" min="0">
    </mat-form-field>
    <mat-slider [max]="max" [min]="0" [step]="1" [showTickMarks]="true">
      <input matSliderThumb [(ngModel)]="dailyAmount">
    </mat-slider>
    <p class="hint">Maximum : {{ max }} / jour</p>

    <mat-form-field>
      <mat-label>Nombre de jours</mat-label>
      <input matInput type="number" [(ngModel)]="days" min="1">
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button mat-flat-button (click)="engage()" [disabled]="userService.isReadOnlySession()">Engager</button>
    <a mat-stroked-button [routerLink]="['/ecosystems', ecosystemPk]">
      <i class="bi bi-arrow-left"></i> Retour
    </a>
  </mat-card-actions>
</mat-card>
}
