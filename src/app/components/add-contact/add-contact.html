<mat-card appearance="outlined">
    <mat-card-content>
        <h1>Nouveau contact</h1>

        @if (recognizedContactName === null) {
            <app-qr-scanner (scanSuccess)="scanSuccessHandler($event)"></app-qr-scanner>
        } @else {
            <div class="scan-success">
                <i class="bi bi-check-circle-fill"></i>
                <p>Contact reconnu : {{ recognizedContactName }}</p>
                <button mat-stroked-button type="button" (click)="scanAgain()">Scanner un autre QR</button>
            </div>
        }
        @if (scanError) {
            <p class="scan-error">{{ scanError }}</p>
        }

        <form [formGroup]="addcontactForm" (ngSubmit)="addContact()">
            <section>
                <mat-form-field>
                    <mat-label>Nom</mat-label>
                    <input matInput type="text" formControlName="name" placeholder="Marie Claude">
                </mat-form-field>
            </section>

            <section>
                <mat-form-field>
                    <mat-label>Clé publique</mat-label>
                    <input matInput type="text" formControlName="pk" placeholder="Un truc à 66 caractères">
                </mat-form-field>
            </section>

            <section>
                <mat-form-field>
                    <mat-label>Serveur</mat-label>
                    <input matInput type="text" formControlName="url" placeholder="https://…">
                </mat-form-field>
            </section>

            @if (formError) {
                <p class="form-error">{{ formError }}</p>
            }

            <section>
                <button mat-flat-button type="submit">Enregistrer</button>
            </section>
        </form>
    </mat-card-content>
</mat-card>
