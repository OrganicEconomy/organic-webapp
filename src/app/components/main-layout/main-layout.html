@if (isTakenOverByAnotherTab()) {
  <div class="other-tab-banner">
    <span>Compte ouvert dans un autre onglet : celui-ci est en lecture seule.</span>
    <button mat-stroked-button type="button" (click)="useThisTab()">Utiliser cet onglet</button>
  </div>
}

<div class="page-content">
  <router-outlet></router-outlet>
</div>

    <span>Accueil</span>
  </a>
  <a routerLink="/pay" routerLinkActive="active">
    <mat-icon>payments</mat-icon>
    <span>Paiement</span>
  </a>
  <a routerLink="/contacts" routerLinkActive="active">
    <mat-icon>people</mat-icon>
    <span>Contacts</span>
  </a>
  <a routerLink="/account" routerLinkActive="active">
    <mat-icon>person</mat-icon>
    <span>Mon compte</span>
  </a>
</nav>
