<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Restaurer mon compte</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="restoreForm" (ngSubmit)="restore()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Serveur</mat-label>
        <input matInput type="text" formControlName="serverUrl" placeholder="https://…">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Adresse mail</mat-label>
        <input matInput type="email" formControlName="email">
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" [attr.aria-label]="'Afficher le mot de passe'" [attr.aria-pressed]="!hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <p class="warning">
        <mat-icon>warning</mat-icon>
        Votre ancien appareil passera en lecture seule dès que ce compte sera restauré ici.
      </p>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      @if (restoring) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }

      <button mat-flat-button color="primary" type="submit" class="full-width submit-btn" [disabled]="restoring">
        Restaurer
      </button>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <a mat-button color="primary" routerLink="/user-selection">Annuler</a>
  </mat-card-actions>
</mat-card>
