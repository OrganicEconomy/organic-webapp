<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>{{ user.name }} — Niveau {{ level }}</mat-card-title>
        <mat-card-subtitle>
            Solde : <span>{{ solde }}</span> <i class="bi bi-cookie"></i>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-header>
        <mat-progress-bar mode="determinate" [value]="percent"></mat-progress-bar>
    </mat-card-header>

    <mat-divider [inset]="true"></mat-divider>

    <mat-card-content>
        <mat-list>
            <mat-list-item>
                <a mat-stroked-button routerLink="/cashpayment" [matBadge]="pendingCount" [matBadgeHidden]="pendingCount === 0" matBadgeColor="accent">
                    <i class="bi bi-router"></i> Recevoir un paiement
                </a>
            </mat-list-item>
            <mat-list-item>
                <a mat-stroked-button routerLink="/cashpapers">
                    <i class="bi bi-qr-code-scan"></i> Encaisser des billets
                </a>
            </mat-list-item>
            <mat-list-item>
                <a mat-stroked-button routerLink="/printpapers">
                    <i class="bi bi-printer"></i> Imprimer des billets
                </a>
            </mat-list-item>
            <mat-list-item>
                <a mat-stroked-button routerLink="/transactions">
                    <i class="bi bi-card-list"></i> Historique de transactions
                </a>
            </mat-list-item>
        </mat-list>
    </mat-card-content>

    <mat-card-actions>
        <a mat-button routerLink="/user-selection">
            <i class="bi bi-power"></i> Déconnexion
        </a>
    </mat-card-actions>
</mat-card>
